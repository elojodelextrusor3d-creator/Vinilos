<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu playlist</title>
<style>
  :root { --bg:#111114; --fg:#f4f4f6; --muted:#9a9aa3; --accent:#ff0033; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px; text-align:center; gap:22px;
  }
  .vinyl {
    width:min(62vw,240px); aspect-ratio:1; border-radius:50%;
    background:#1b1b1f;
    box-shadow:0 0 0 2px #2a2a30, 0 18px 40px rgba(0,0,0,.5);
    position:relative; animation:spin 3s linear infinite;
  }
  /* surcos + brillo (el brillo es lo que deja ver que gira) */
  .vinyl::after {
    content:""; position:absolute; inset:4%; border-radius:50%;
    background:
      conic-gradient(transparent 0 25deg, rgba(255,255,255,.13) 45deg, transparent 65deg 205deg,
                     rgba(255,255,255,.13) 225deg, transparent 245deg),
      repeating-radial-gradient(circle, transparent 0 5px, rgba(255,255,255,.06) 5px 6px);
    -webkit-mask:radial-gradient(circle, transparent 0 36%, #000 36.5%);
            mask:radial-gradient(circle, transparent 0 36%, #000 36.5%);
  }
  /* etiqueta del centro con una franja blanca */
  .label {
    position:absolute; inset:33%; border-radius:50%;
    background:
      radial-gradient(circle, var(--bg) 0 11%, transparent 11.5%),
      conic-gradient(var(--accent) 0 320deg, rgba(255,255,255,.9) 320deg 338deg, var(--accent) 338deg);
  }
  .label.cover { inset:31%; box-shadow:0 0 0 4px var(--accent); }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { margin:0; font-size:1.6rem; }
  p { margin:0; color:var(--muted); }
  .btn {
    display:block; width:min(100%,360px); padding:18px 20px; border-radius:999px;
    background:var(--accent); color:#fff; font-size:1.15rem; font-weight:700;
    text-decoration:none; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .btn:active { transform:scale(.98); }
  .alt { color:var(--muted); font-size:.9rem; }
  .brand { margin-top:8px; font-size:.85rem; color:var(--muted); }
  .brand a { color:var(--fg); }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="vinyl" aria-hidden="true"><div class="label"></div></div>
  <div>
    <h1 id="title">Tu playlist</h1>
    <p id="sub">Tocá el botón para escucharla</p>
  </div>
  <a id="open" class="btn hidden" href="#">▶ Abrir</a>
  <a id="web" class="alt hidden" href="#">¿No se abre? Escuchala en el navegador</a>
  <div class="brand" id="brand"></div>

<script>
  // ===== Personalizá acá =====
  const MARCA = "";       // ej: "Vinilos Shiko"
  const INSTAGRAM = "";   // ej: "vinilos.shiko" (sin @)
  // ===========================

  // Tolera links pegados con basura al final (ej: "?si=..." de Spotify).
  const q = new URLSearchParams(location.search);
  for (const k of ["s", "y"]) {
    const v = q.get(k);
    if (v) q.set(k, v.split(/[^A-Za-z0-9_-]/)[0]);
  }
  const ID = /^[A-Za-z0-9_-]{2,80}$/;
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);

  const services = {
    y: { name: "YouTube Music", color: "#ff0033", pkg: "com.google.android.apps.youtube.music",
         path: id => "music.youtube.com/playlist?list=" + id },
    s: { name: "Spotify", color: "#1db954", pkg: "com.spotify.music",
         path: id => "open.spotify.com/playlist/" + id },
  };

  const key = Object.keys(services).find(k => ID.test(q.get(k) || ""));
  const $ = id => document.getElementById(id);

  const name = (q.get("n") || "").slice(0, 60);
  if (name) { $("title").textContent = name; document.title = name; }

  if (MARCA || INSTAGRAM) {
    const b = $("brand");
    if (MARCA) b.append(MARCA);
    if (INSTAGRAM) {
      if (MARCA) b.append(" · ");
      const a = document.createElement("a");
      a.href = "https://instagram.com/" + INSTAGRAM;
      a.textContent = "@" + INSTAGRAM;
      b.append(a);
    }
  }

  if (!key) {
    $("sub").textContent = "Este llavero no tiene una playlist válida.";
  } else {
    const sv = services[key];
    const id = q.get(key);
    const web = "https://" + sv.path(id);
    // En Android se le pasa el link directo a la app (igual que WhatsApp).
    const intentBase = "intent://" + sv.path(id) + "#Intent;scheme=https;package=" + sv.pkg;
    // Botón (toque del usuario): si no está la app, cae a la web.
    const href = isAndroid
      ? intentBase + ";S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
      : web;

    document.documentElement.style.setProperty("--accent", sv.color);
    const btn = $("open");
    btn.href = href;
    btn.textContent = "▶ Abrir en " + sv.name;
    btn.classList.remove("hidden");
    const alt = $("web");
    alt.href = web;
    alt.classList.remove("hidden");

    // Sin apertura automática: desde un NFC el navegador la desvía a la web.
    // Se abre solo con el toque en el botón.

    // Sin nombre personalizado (&n=): muestra el nombre real de la playlist.
    // Con &p=1: la etiqueta del vinilo muestra la portada (con un aro del color del servicio).
    const wantCover = q.get("p") === "1";
    if (!name || wantCover) {
      const oembed = key === "s"
        ? "https://open.spotify.com/oembed?url=" + encodeURIComponent("https://open.spotify.com/playlist/" + id)
        : "https://www.youtube.com/oembed?format=json&url=" +
          encodeURIComponent("https://www.youtube.com/playlist?list=" + id);
      fetch(oembed).then(r => r.ok ? r.json() : null).then(info => {
        if (!info) return;
        if (!name && info.title) { $("title").textContent = info.title; document.title = info.title; }
        const thumb = info.thumbnail_url;
        if (wantCover && thumb && /^https:\/\//.test(thumb)) {
          const img = new Image();
          img.onload = () => {
            const size = key === "y" ? "auto 135%" : "cover"; // YouTube trae franjas negras
            const label = document.querySelector(".label");
            label.style.background =
              'radial-gradient(circle, var(--bg) 0 11%, rgba(255,255,255,.85) 11.5% 13%, transparent 13.5%), url("' +
              thumb.replace(/"/g, "") + '") center / ' + size + ' no-repeat, #000';
            label.classList.add("cover");
          };
          img.src = thumb;
        }
      }).catch(() => {});
    }
  }
</script>
</body>
</html>
